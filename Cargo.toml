[package]
name = "alfred_gitmoji"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
description = "Search Gitmoji with Alfred."
license = "BSD-3-Clause"
publish = false

[dependencies]
alfred_workflow_rs = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.3"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
