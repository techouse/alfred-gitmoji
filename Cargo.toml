[package]
name = "alfred_gitmoji"
version = "1.4.2"
edition = "2024"
rust-version = "1.88"
description = "Search Gitmoji with Alfred."
license = "MIT"
publish = false

[dependencies]
alfred_workflow_rs = "1.0.1"
anyhow = "1.0"
dotenvy = "0.15"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.3", features = ["platform-verifier"] }
url = "2.5"

[dev-dependencies]
flate2 = "1.1"
tempfile = "3.10"
