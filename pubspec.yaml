name: alfred_gitmoji
description: Search for gitmojis and copy them to the clipboard easily.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.3.6

environment:
  sdk: ^3.10.0


dependencies:
  algoliasearch: ^1.49.1
  args: ^2.7.0
  alfred_workflow: ^1.2.4
  cli_script: ^1.0.0
  crypto: ^3.0.7
  envied: ^1.3.4
  http: ^1.6.0
  json_annotation: ^4.11.0
  path: ^1.9.1
  recase: ^4.1.0
  stash: ^5.2.0

dev_dependencies:
  build_runner: ^2.13.1
  envied_generator: ^1.3.4
  json_serializable: ^6.13.1
  lints: ^6.1.0
